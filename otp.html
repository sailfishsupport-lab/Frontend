<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAILFISH | Verify OTP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
        }
        .logo span {
            color: #0066ff;
        }
        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            letter-spacing: 2px;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0066ff;
        }
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
            transition: background-color 0.2s;
        }
        button.submit-btn:hover {
            background-color: #0052cc;
        }
        .timer-container {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666666;
        }
        .timer-container button {
            background: none;
            border: none;
            color: #0066ff;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
        }
        .timer-container button:disabled {
            color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SAIL<span>FISH</span></div>
        <h2>Enter verification code</h2>
        <div class="subtitle">We have sent a 6-digit OTP code to your email.</div>
        
        <form id="otpForm">
            <div class="input-group">
                <label for="otp">OTP Code</label>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
            </div>
            
            <button type="submit" class="submit-btn">Verify OTP →</button>
        </form>

        <div class="timer-container">
            <span id="timerText">Resend OTP in <strong id="countdown">60</strong>s</span>
            <button id="resendBtn" style="display: none;" onclick="resendOTP()">Resend OTP</button>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        let timeLeft = 60;
        const countdownEl = document.getElementById('countdown');
        const timerTextEl = document.getElementById('timerText');
        const resendBtn = document.getElementById('resendBtn');

        const timerInterval = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerTextEl.style.display = 'none';
                resendBtn.style.display = 'inline';
            }
        }, 1000);

        const userEmail = localStorage.getItem('resetEmail') || "user@example.com";
        const whatsappNumber = "919219914526";
const message = `Hello, mujhe apna password reset karna hai. Meri email id yeh hai: ${userEmail}. Mera OTP kya hai?`;
window.location.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
        

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            
            const result = await window.SAILFISH_API.verifyOTP(userEmail, otp);
            alert(result.message);
            if(result.message.includes("success")) {
                window.location.href = "forgot-password.html";
            }
        });

        async function resendOTP() {
            const result = await window.SAILFISH_API.sendOTP(userEmail);
            alert(result.message);
            
            timeLeft = 60;
            countdownEl.textContent = timeLeft;
            timerTextEl.style.display = 'inline';
            resendBtn.style.display = 'none';
            
            const newInterval = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(newInterval);
                    timerTextEl.style.display = 'none';
                    resendBtn.style.display = 'inline';
                }
            }, 1000);
        }
    </script>
</body>
</html>
