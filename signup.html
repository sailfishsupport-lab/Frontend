<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        .msg { margin-top: 15px; text-align: center; font-size: 14px; }
        .msg.err { color: red; }
        .msg.ok { color: green; }
        .bottom { margin-top: 15px; text-align: center; font-size: 14px; }
        .link { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">Create Account</div>
        <form id="signupForm">
            <div class="group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email" required>
            </div>
            <div class="group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create password" required>
            </div>
            <div class="group">
                <label>Confirm Password</label>
                <input type="password" id="signupConfirm" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn" id="signupBtn">Create Account</button>
            <div class="msg" id="signupMsg"></div>
            <div class="bottom">Already have an account? <a href="login.html" class="link">Login</a></div>
        </form>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            const confirmPassword = document.getElementById("signupConfirm").value;
            const msg = document.getElementById("signupMsg");
            const btn = document.getElementById("signupBtn");

            if (!email) {
                msg.textContent = "Please enter your email.";
                msg.className = "msg err";
                return;
            }

            if (password.length < 6) {
                msg.textContent = "Password must be at least 6 characters.";
                msg.className = "msg err";
                return;
            }

            if (password !== confirmPassword) {
                msg.textContent = "Password and confirm password do not match.";
                msg.className = "msg err";
                return;
            }

            btn.disabled = true;
            msg.textContent = "Creating account...";
            msg.className = "";

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    msg.textContent = "Account created successfully! Redirecting...";
                    msg.className = "msg ok";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                } else {
                    msg.textContent = data.message || "Could not create account.";
                    msg.className = "msg err";
                }
            } catch (error) {
                msg.textContent = "Network error. Please try again.";
                msg.className = "msg err";
            }

            btn.disabled = false;
        });
    </script>

</body>
</html>
